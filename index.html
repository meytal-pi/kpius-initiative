<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Initiative Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=4">
  <script>
    // Shows script errors on screen (helps diagnose problems on tablets). Old-browser-safe syntax.
    (function () {
      function show(msg) {
        var box = document.getElementById('fatalError');
        if (!box) {
          box = document.createElement('div');
          box.id = 'fatalError';
          box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#7f1d1d;color:#fff;font:14px monospace;padding:10px;white-space:pre-wrap;max-height:40%;overflow:auto';
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += msg + '\n';
      }
      window.addEventListener('error', function (e) {
        show('Error: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) { show('Error: ' + (e.reason && e.reason.message || e.reason)); });
      window.addEventListener('load', function () {
        var m = navigator.userAgent.match(/Chrom(e|ium)\/(\d+)/);
        if (!window.__appStarted) show('The app did not start. Browser: ' + (m ? 'Chrome ' + m[2] : navigator.userAgent));
      });
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title">⚔ Initiative</div>
      <button id="roleBadge" class="role-badge" title="Change who uses this device"></button>
      <div id="roundBox" class="round hidden">Round <b id="roundNum">1</b></div>
      <div class="spacer"></div>
      <span id="syncDot" class="sync-dot" title="Connecting…"></span>
      <button id="btnPip" class="icon-btn" title="Mini always-on-top view">⧉</button>
      <button id="btnSettings" class="icon-btn" title="Settings">⚙</button>
    </header>

    <div id="banner" class="banner hidden"></div>

    <main id="main">
      <div class="content">
        <section id="pendingSection" class="hidden">
          <h2 class="section-title">Needs initiative <span class="hint">tap a name to enter</span></h2>
          <div id="pendingList" class="pending-list"></div>
        </section>
        <div id="orderList" class="order-list"></div>
        <div id="emptyState" class="empty hidden"></div>
      </div>
    </main>

    <footer class="bottombar">
      <button id="btnAdd" class="btn primary">＋ Add</button>
      <button id="btnParty" class="btn">Party</button>
      <button id="btnEncounter" class="btn">Encounter ▾</button>
      <div class="spacer"></div>
      <button id="btnStart" class="btn primary hidden">Start combat ▶</button>
      <div id="turnControls" class="turn-controls hidden">
        <button id="btnPrev" class="btn" title="Previous turn">◀</button>
        <button id="btnNext" class="btn primary big" title="Next turn">Next turn ▶</button>
      </div>
    </footer>
  </div>

  <div id="miniRoot" class="hidden"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="firebase-config.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
